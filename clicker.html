<!Doctype html>

<html>
    <head>
        <title>
            Clicker game V7.2
        </title>
    </head>
    <body>
        <h1 id="cash">
            0 Gasters
        </h1>

        <h1 id="mana">
            0 Mana
        </h1>

        <button onclick="add()">
            Add
        </button>

        <button onclick="upgrade()" id="upgrade">
            Upgrade Adder (10 Gasters)
        </button>

        <button onclick="manaUpgrade()" id="manaUpgrade">
            Upgrade Mana Adder (30 Gasters)
        </button>

        <button onclick="clicker()" id="clicker">
            Get Clicker (20 Gasters)
        </button>

        <button onclick="clicker2()" id="clicker2">
            Get Clicker V2 (150 Gasters)
        </button>

        <button onclick="clicker3()" id="clicker3">
            Get Clicker V3 (300 Gasters)
        </button>

        <button onclick="cashSupply()" id="cashSupply">
            Gaster Supply (100 Mana)
        </button>

        <button onclick="cashSupplyUpgrade()" id="cashSupplyUpgrade">
            Upgrade Gaster Supply (100 Mana)
        </button>

        <script>
            const clickSound = new Audio("click.wav");
            let cps = 0;
            let cpc = 1;
            let cpCashSupply = 1000;
            let cash = 0;
            let upgradeCost = 10;
            let clickerCost = 20;
            let clicker2Cost = 150;
            let clicker3Cost = 300;
            let manaUpgradeCost = 30;
            let mana = 0;
            let mpc = 1;
            let mps = 0;
            let cashSupplyMana = 100;
            let cashSupplyUpgradeMana = 100;

            function autoAdd(){
                cash += cps;
                document.getElementById("cash").textContent = cash + " Gasters";
            }
            function add(){
                cash += cpc;
                mana += mpc;
                clickSound.currentTime = 0;
                clickSound.play();
                document.getElementById("cash").textContent = cash + " Gasters";
                document.getElementById("mana").textContent = mana + " Mana";
            }
            function upgrade(){
                if (cash >= upgradeCost){
                    cash -= upgradeCost;
                    cpc++;
                    upgradeCost += 15;
                    document.getElementById("cash").textContent = cash + " Gasters";
                    document.getElementById("upgrade").textContent = "Upgrade Adder (" + upgradeCost + " Gasters)";
                }
            }
            function clicker(){
                if (cash >= clickerCost){
                    cash -= clickerCost;
                    cps++;
                    clickerCost += 25;
                    document.getElementById("cash").textContent = cash + " Gasters";
                    document.getElementById("clicker").textContent = "Get Clicker (" + clickerCost + " Gasters)";
                }
            }
            function clicker2(){
                if (cash >= clicker2Cost){
                    cps += 10;
                    cash -= clicker2Cost;
                    clicker2Cost += 200;
                    document.getElementById("cash").textContent = cash + " Gasters";
                    document.getElementById("clicker2").textContent = "Get Clicker V2 (" + clicker2Cost + " Gasters)";
                }
            }
            function clicker3(){
                if (cash >= clicker3Cost){
                    cps += 100;
                    cash -= clicker3Cost;
                    clicker3Cost += 500
                    document.getElementById("cash").textContent = cash + " Gasters";
                    document.getElementById("clicker3").textContent = "Get Clicker V3 (" + clicker3Cost + " Gasters)";
                }
            }
            function manaUpgrade(){
                if (cash >= manaUpgradeCost){
                    mpc += 1;
                    cash -= manaUpgradeCost;
                    manaUpgradeCost += 50;
                    document.getElementById("cash").textContent = cash + " Gasters";
                    document.getElementById("mana").textContent = mana + " Mana";
                    document.getElementById("manaUpgrade").textContent = "Upgrade Mana Adder (" + manaUpgradeCost + " Gasters)";
                }
            }
            function cashSupply(){
                if (mana >= cashSupplyMana){
                    cash += cpCashSupply;
                    mana -= cashSupplyMana;
                    document.getElementById("cash").textContent = cash + " Gasters";
                    document.getElementById("mana").textContent = mana + " Mana";
                }
            }
            function cashSupplyUpgrade(){
                if (mana >= cashSupplyUpgradeMana){
                    cpCashSupply += 5000;
                    mana -= cashSupplyUpgradeMana;
                    cashSupplyMana += 100
                    cashSupplyUpgradeMana += 200
                    document.getElementById("mana").textContent = mana + " Mana";
                    document.getElementById("cashSupply").textContent = "Gaster Supply (" + cashSupplyMana + " Mana)"
                    document.getElementById("cashSupplyUpgrade").textContent = "Upgrade Gaster Supply (" + cashSupplyUpgradeMana + " Mana)";
                }
            }
            setInterval(autoAdd, 1000)
        </script>
    </body>
</html>
